spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

jwt:
  secret: ${JWT_SECRET}

ticketing:
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    consumers-enabled: ${MESSAGING_CONSUMERS_ENABLED:true}
    order-exchange: ${ORDER_EXCHANGE:order.exchange}
    order-create-queue: ${ORDER_CREATE_QUEUE:order.create.queue}
    order-create-routing-key: ${ORDER_CREATE_ROUTING_KEY:order.create}
    order-expire-exchange: ${ORDER_EXPIRE_EXCHANGE:order.expire.exchange}
    order-hold-ttl-queue: ${ORDER_HOLD_TTL_QUEUE:order.hold.ttl.queue}
    order-hold-delay-routing-key: ${ORDER_HOLD_DELAY_ROUTING_KEY:order.create.delay}
    order-expire-queue: ${ORDER_EXPIRE_QUEUE:order.expire.queue}
    order-expire-routing-key: ${ORDER_EXPIRE_ROUTING_KEY:order.expire}
    outbox-exchange: ${OUTBOX_EXCHANGE:ticketing.events.exchange}
    outbox-order-created-queue: ${OUTBOX_ORDER_CREATED_QUEUE:ticketing.events.order-created.queue}
    outbox-order-created-routing-key: ${OUTBOX_ORDER_CREATED_ROUTING_KEY:order.created}
    outbox-order-expired-queue: ${OUTBOX_ORDER_EXPIRED_QUEUE:ticketing.events.order-expired.queue}
    outbox-order-expired-routing-key: ${OUTBOX_ORDER_EXPIRED_ROUTING_KEY:order.expired}
    outbox-payment-success-queue: ${OUTBOX_PAYMENT_SUCCESS_QUEUE:ticketing.events.payment-success.queue}
    outbox-payment-success-routing-key: ${OUTBOX_PAYMENT_SUCCESS_ROUTING_KEY:payment.success}
    outbox-publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    outbox-publisher-interval: ${OUTBOX_PUBLISHER_INTERVAL:1s}
    outbox-batch-size: ${OUTBOX_BATCH_SIZE:50}
    relay-enabled: ${RESERVATION_RELAY_ENABLED:true}
    relay-interval: ${RESERVATION_RELAY_INTERVAL:1s}
    relay-batch-size: ${RESERVATION_RELAY_BATCH_SIZE:50}
    relay-claim-lease: ${RESERVATION_RELAY_CLAIM_LEASE:15s}
    reservation-intent-retry-delay: ${RESERVATION_INTENT_RETRY_DELAY:5s}
    reservation-intent-max-retry-delay: ${RESERVATION_INTENT_MAX_RETRY_DELAY:1m}
    publisher-confirm-timeout: ${RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT:5s}
    reconciliation-interval: ${RECONCILIATION_INTERVAL:1m}
    order-creation-grace-period: ${ORDER_CREATION_GRACE_PERIOD:10s}
    reconciliation-batch-size: ${RECONCILIATION_BATCH_SIZE:100}
